name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
        env:
          MONGODB_URI: mongodb://localhost:27017/danceapp_test
          JWT_ACCESS_SECRET: ci-test-secret-access
          JWT_REFRESH_SECRET: ci-test-secret-refresh
          OTP_PROVIDER: mock
          NODE_ENV: test
          LOG_LEVEL: silent

      - name: Build
        run: pnpm build
        env:
          MONGODB_URI: mongodb://localhost:27017/danceapp_test
          JWT_ACCESS_SECRET: ci-test-secret-access
          JWT_REFRESH_SECRET: ci-test-secret-refresh
          OTP_PROVIDER: mock
          NODE_ENV: test
          LOG_LEVEL: silent
          WEB_URL: http://localhost:3000
